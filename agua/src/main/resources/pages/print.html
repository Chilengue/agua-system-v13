<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1a17">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <title>Imprimir · AguaSystem</title>
</head>
<body>
<style id="pageSize"></style>
<style>body{background:#e5e9ec}#bar{display:flex;gap:8px;justify-content:center;padding:12px}#doc{padding:10px}@media print{body{background:#fff}#bar{display:none}#doc{padding:0}}</style>
<div id="bar"><button class="btn-primary" onclick="window.print()">Imprimir</button><button class="btn-secondary" id="btnPdf" style="display:none">Baixar PDF</button><button class="btn-secondary" onclick="history.length > 1 ? history.back() : window.close()">Fechar</button></div>
<div id="doc"><div class="spinner"></div></div>
  <script src="/js/app.js"></script>
  <script src="/vendor/jspdf.umd.min.js"></script>
  <script src="/js/print-docs.js"></script>
  <script src="/js/pages/print.js"></script>
</body>
</html>
