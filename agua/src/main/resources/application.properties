# ============================================================
# AguaSystem v13 — configuração
# Os valores ${VAR:padrão} vêm do ficheiro .env (ao lado do pom.xml) ou de variáveis de ambiente.
# O .env é encontrado mesmo que a aplicação seja arrancada a partir da pasta de cima.
# ============================================================
spring.application.name=agua-system
spring.config.import=optional:file:.env[.properties],optional:file:${agua.project.dir:.}/.env[.properties]

server.port=${PORT:8080}
server.servlet.session.timeout=${SESSION_TIMEOUT:12h}
server.servlet.session.cookie.name=AGUA_SID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
server.compression.enabled=true
server.tomcat.max-http-form-post-size=4MB
spring.mvc.converters.preferred-json-mapper=jackson

# ---- PostgreSQL ----
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agua_system}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=${APP_TIMEZONE:Africa/Maputo}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ---- JSON ----
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=${APP_TIMEZONE:Africa/Maputo}

# ---- Email (recuperação de senha). Sem MAIL_HOST os pedidos vão para o administrador. ----
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000

# ---- Estado da aplicação ----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# ---- Aplicação ----
app.version=13.0.0
app.timezone=${APP_TIMEZONE:Africa/Maputo}
app.allowed-origins=${ALLOWED_ORIGINS:}
app.support-phone=${SUPPORT_PHONE:861544303}
app.support-name=${SUPPORT_NAME:Gestora Paula Zacarias}
app.auto-approve-companies=${AUTO_APPROVE_COMPANIES:false}
app.mail-from=${MAIL_FROM:}
app.dev-show-reset-code=${DEV_SHOW_RESET_CODE:false}

# ---- Mensagens (planos Standard e Enterprise) ----
# Sem API configurada, as mensagens abrem no WhatsApp/SMS do operador (link) — funciona sem custos.
# SMS: gateway HTTP da plataforma. Recebe POST JSON {"from","to","message"} com "Authorization: Bearer <token>".
#      Cada empresa pode indicar o seu próprio gateway em Empresa e recibo → Mensagens.
app.sms-api-url=${SMS_API_URL:}
app.sms-api-token=${SMS_API_TOKEN:}
# WhatsApp Cloud API (Meta). O número e o token são de cada empresa (Empresa e recibo → Mensagens).
app.whatsapp-api-url=${WHATSAPP_API_URL:https://graph.facebook.com/v20.0}

logging.level.mz.agua=INFO
