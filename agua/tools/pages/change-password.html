title: Alterar senha
layout: plain
scripts: /js/pages/auth.js
---
<div class="auth">
  <form class="auth-card" id="passwordForm">
    <div class="brand"><div><h1>Alterar senha</h1><span class="muted" id="pwHint">Escolha uma senha nova (mínimo 6 caracteres).</span></div></div>
    <div class="field"><label>Senha atual</label><input type="password" name="current_password" required></div>
    <div class="field"><label>Nova senha</label><input type="password" name="new_password" minlength="6" required></div>
    <div class="field"><label>Confirmar nova senha</label><input type="password" name="confirm" minlength="6" required></div>
    <div class="error" id="pwError"></div>
    <button class="btn-primary btn-block btn-lg" type="submit">Guardar</button>
    <p style="margin-top:14px;text-align:center"><a href="/" class="muted">Voltar</a> · <a href="#" class="muted" id="pwLogout">Sair</a></p>
  </form>
</div>
